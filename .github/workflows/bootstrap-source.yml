name: bootstrap-v0.1.0-source

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.head_ref == 'bootstrap-v010'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Import AI-IP Shield v0.1.0 source
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          chunks=(.bootstrap/chunk-*.b64)
          if [ ${#chunks[@]} -eq 0 ]; then
            echo "Bootstrap chunks already consumed; nothing to do."
            exit 0
          fi
          tmp="$(mktemp --suffix=.tar.xz)"
          cat "${chunks[@]}" | tr -d '\n\r' | base64 -d > "$tmp"
          echo "674490c76f935ee0cf2de8da2c4af6624635115c0d37f5a614b5deb030046d38  $tmp" | sha256sum -c -
          tar -xJf "$tmp" -C .
          rm -f "$tmp"
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "chore: import AI-IP Shield v0.1.0 source"
          git push origin HEAD:${GITHUB_HEAD_REF}
